name: Feature request
description: Suggest an improvement or new workflow.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is hard, slow, or missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would make the workflow better?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard
        - Compose
        - Drafts
        - Activity
        - Errors
        - Settings
        - Facebook adapter
        - Kijiji adapter
        - Data export or backup
        - Developer tooling
        - Other
    validations:
      required: true
